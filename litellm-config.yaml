model_list:
  # Primary: Lowest-cost capable model (default route)
  - model_name: deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
  # Reasoning tier
  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
  # Google flagship (1M context)
  - model_name: gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
  # OpenAI mid-tier
  - model_name: gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY
  # Anthropic mid-tier
  - model_name: claude-sonnet-4.6
    litellm_params:
      model: anthropic/claude-sonnet-4.6
      api_key: os.environ/ANTHROPIC_API_KEY
  # Anthropic flagship
  - model_name: claude-opus-4.8
    litellm_params:
      model: anthropic/claude-opus-4.8
      api_key: os.environ/ANTHROPIC_API_KEY
  # Anthropic budget
  - model_name: claude-haiku-4.5
    litellm_params:
      model: anthropic/claude-haiku-4.5
      api_key: os.environ/ANTHROPIC_API_KEY

router_settings:
  routing_strategy: latency-based-routing
  routing_strategy_args:
    ttl: 3600
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
  fallbacks: [{"deepseek/deepseek-v4-flash": ["gemini/gemini-3.5-flash", "openai/gpt-5.4"]}]

litellm_settings:
  cache: true
  cache_params:
    type: qdrant
    qdrant_api_base: "http://qdrant:6333"
    qdrant_collection_name: "semantic_cache"
    similarity_threshold: 0.90
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
