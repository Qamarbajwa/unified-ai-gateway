version: '3.8'

services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.87.0
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gaas_admin}:${POSTGRES_PASSWORD:-gaas_secure_password_99}@db:5432/${POSTGRES_DB:-gaas_gateway}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secure_password_88}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-gaas-master-change-me-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    command: [ "--config", "/app/config.yaml", "--detailed_debug" ]
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-gaas_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-gaas_secure_password_99}
      - POSTGRES_DB=${POSTGRES_DB:-gaas_gateway}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_password_88}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.50.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:10.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  agent-auth:
    build:
      context: ./services/agent-auth
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_password_88}@redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  mcp-server:
    build:
      context: ./services/mcp-server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LITELLM_URL=http://litellm:4000
      - AGENT_AUTH_URL=http://agent-auth:8001
    depends_on:
      - litellm
      - agent-auth
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  qdrant_data:
  grafana_data:

